<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Sentiment Analysis</title>
    <style>
        /* Dark Theme Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background: #121212;
            color: white;
            text-align: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Navigation Bar */
        .navbar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            background: rgba(20, 20, 20, 0.8);
            position: absolute;
            top: 0;
            left: 0;
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.2);
        }

        .navbar h1 {
            font-size: 22px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6b6b, #f06595, #845ef7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: #ccc;
            font-size: 16px;
            transition: color 0.3s ease-in-out;
        }

        .nav-links a:hover {
            color: #ff6b6b;
        }

        /* Main Content */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-top: 80px;
        }

        /* Button Styling */
        .predict-btn {
            position: relative;
            background: linear-gradient(45deg, #ff6b6b, #f06595, #845ef7);
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s ease-in-out;
            box-shadow: 0px 4px 15px rgba(255, 107, 107, 0.5);
            z-index: 1;
            overflow: hidden;
            margin-top: 20px;
        }

        .predict-btn::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300%;
            height: 300%;
            background: rgba(255, 255, 255, 0.2);
            transition: width 0.5s, height 0.5s, top 0.5s, left 0.5s;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
        }

        .predict-btn:hover::before {
            width: 100%;
            height: 100%;
        }

        .predict-btn:hover {
            transform: scale(1.05);
            box-shadow: 0px 6px 20px rgba(255, 107, 107, 0.8);
        }

        /* Floating Glowing Circles */
        .floating-circle {
            position: absolute;
            width: 100px;
            height: 100px;
            background: rgba(255, 107, 107, 0.3);
            border-radius: 50%;
            filter: blur(40px);
            animation: float 10s infinite alternate ease-in-out;
        }

        .circle-1 { top: 10%; left: 10%; }
        .circle-2 { bottom: 15%; right: 15%; animation-duration: 12s; }
        .circle-3 { top: 50%; left: 50%; width: 150px; height: 150px; animation-duration: 15s; }

        @keyframes float {
            0% { transform: translateY(0) translateX(0); }
            100% { transform: translateY(-30px) translateX(30px); }
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <div class="navbar">
        <h1>ChatGPT Sentiment Analysis</h1>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="content">
        <button class="predict-btn">Predict Sentiment</button>
    </div>

    <!-- Floating circles for animated background -->
    <div class="floating-circle circle-1"></div>
    <div class="floating-circle circle-2"></div>
    <div class="floating-circle circle-3"></div>

</body>
</html>
